<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>newsletter</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 20px;
            font-family: "Times New Roman", serif;
            text-align: center;
        }

        p {
            color: #00ff00;
            font-size: 18px;
            margin-top: 20px;
        }

        a {
            color: #00ff00;
        }

        .embeddable-buttondown-form {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .embeddable-buttondown-form label {
            color: #00ff00;
            font-size: 16px;
        }

        .embeddable-buttondown-form input[type="email"] {
            background-color: #000000;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-family: "Times New Roman", serif;
            font-size: 16px;
            padding: 8px 12px;
            width: 250px;
            max-width: 80vw;
        }

        .embeddable-buttondown-form input[type="email"]::placeholder {
            color: #007700;
        }

        .embeddable-buttondown-form input[type="submit"] {
            background-color: #000000;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-family: "Times New Roman", serif;
            font-size: 16px;
            padding: 8px 16px;
            cursor: pointer;
        }

        .embeddable-buttondown-form input[type="submit"]:hover {
            background-color: #00ff00;
            color: #000000;
        }
    </style>
</head>
<body>
    <p>subscribe to jo's newsletter</p>

    <form
        action="https://buttondown.com/api/emails/embed-subscribe/jgb_jackets"
        method="post"
        target="popupwindow"
        onsubmit="window.open('https://buttondown.com/jgb_jackets', 'popupwindow')"
        class="embeddable-buttondown-form"
    >
        <label for="bd-email">enter your email</label>
        <input type="email" name="email" id="bd-email" placeholder="you@example.com" required />
        <input type="submit" value="subscribe" />
    </form>

    <p><a href="index.html">back home</a></p>
</body>
</html>
